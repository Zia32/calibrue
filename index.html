<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calibrue</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: two device cards side by side, stacking on phones. */
:root{--bg:#f3f5f6;--card:#fff;--fg:#121619;--muted:#5a656e;--line:#d6dce0;--accent:#1f6bd6;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1214;--card:#171b1e;--fg:#e7ebee;--muted:#97a2aa;--line:#2a3135;--accent:#6aa1f4;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);padding:max(32px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:26px;text-wrap:balance}
p{margin:0;color:var(--muted);max-width:60ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
a.card{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
a.card strong{font-size:18px}
a.card span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Calibrue</h1>
  <p>Milestone 1: signal test. Open the first page on the Windows laptop and the second on the iPhone in Safari.</p>
  <div class="cards">
    <a class="card" href="laptop.html"><strong>Laptop: patch display</strong><span>Shows the flickering test patch.</span></a>
    <a class="card" href="phone.html"><strong>iPhone: flicker sensor</strong><span>Reads the patch with the camera.</span></a>
  </div>
</main>
</body>
</html>
